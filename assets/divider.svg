<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" width="100%" height="12">
  <defs>
    <clipPath id="line-clip">
      <rect x="0" y="5" width="900" height="2" rx="1" />
    </clipPath>

    <linearGradient id="glow-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <style>
      .beam {
        animation: slide 4.5s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-320px); }
        100% { transform: translateX(920px); }
      }
    </style>
  </defs>

  <rect x="0" y="5.5" width="900" height="1" rx="0.5" fill="#818CF8" fill-opacity="0.18" />

  <g clip-path="url(#line-clip)">
    <rect class="beam" x="0" y="4" width="300" height="4" fill="url(#glow-beam)" />
  </g>
</svg>
